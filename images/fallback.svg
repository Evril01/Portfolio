<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Fallback image</title>
  <desc id="desc">Fallback portrait graphic when the main image is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="300" fill="url(#bg)"/>
  <circle cx="300" cy="220" r="110" fill="#cbd5e1"/>
  <path d="M170 500c18-90 86-140 130-140s112 50 130 140" fill="#cbd5e1"/>
  <text x="300" y="560" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#f8fafc">No Photo</text>
</svg>
